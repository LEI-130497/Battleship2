# 131635 - Antonio Santos

version: "1.0"
linter: qodana-jvm-community

profile:
  name: empty

inspections:
  - inspection: ClassWithTooManyMethods
    enabled: true
    severity: WARNING
    options:
      m_limit: 15

  - inspection: ClassWithTooManyFields
    enabled: true
    severity: WARNING
    options:
      m_limit: 10

  - inspection: OverlyComplexClass
    enabled: true
    severity: WARNING
    options:
      m_limit: 47

failThreshold: 0
disableSanityInspections: true
