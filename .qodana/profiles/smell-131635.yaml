version: "1.0"

profile:
  base:
    name: empty

  inspections:
    - inspection: ClassWithTooManyMethods
      enabled: true
      severity: WARNING
      options:
        m_limit: 15

    - inspection: ClassWithTooManyFields
      enabled: true
      severity: WARNING
      options:
        m_limit: 10

    - inspection: OverlyComplexClass
      enabled: true
      severity: WARNING
      options:
        m_limit: 47