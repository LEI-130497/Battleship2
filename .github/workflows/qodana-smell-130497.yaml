# 130497 - Nathan Calfayan
name: Qodana smell gate 130497

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-long-method:
    name: Qodana Long Method
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Community for JVM
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: >-
            --linter qodana-jvm-community
            --config qodana-130497.yaml