# 130497 - Nathan Calfayan
name: Qodana smell gate 130497

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-long-method:
    name: Qodana Long Method
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Community for JVM
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: >-
            --linter qodana-jvm-community
            --config qodana-130497.yaml
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true

      - name: Listar instancias do cheiro (ficheiro e linha)
        if: always()
        run: |
          SARIF=$(find "${{ runner.temp }}" -name qodana.sarif.json | head -n 1)
          echo "SARIF encontrado em: $SARIF"
          if [ -z "$SARIF" ]; then echo "Sem SARIF"; exit 0; fi

          {
            echo "### Instancias do cheiro Long Method"
            echo ""
            echo "| Inspecao | Ficheiro | Linha | Mensagem |"
            echo "|---|---|---|---|"
            jq -r '.runs[0].results[] |
              "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text | gsub("\n";" ")) |"' "$SARIF"
          } >> "$GITHUB_STEP_SUMMARY"

          # anotacoes diretamente nas linhas do codigo
          jq -r '.runs[0].results[] |
            "::warning file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine),title=\(.ruleId)::\(.message.text | gsub("\n";" "))"' "$SARIF"