# 131635 - Antonio Santos
name: Qodana smell gate 131635

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-large-class:
    name: Qodana Large Class quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Community for JVM
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: >-
            --linter qodana-jvm-community
            --config qodana-131497.yaml
          pr-mode: false
          use-caches: false
          upload-result: true
